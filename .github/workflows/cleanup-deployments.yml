name: 清理 Cloudflare Pages 旧部署

on:
  schedule:
    # 每天北京时间 8:00 执行（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 清理旧部署
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          KEEP_LATEST: 3
        run: |
          echo "开始清理 Cloudflare Pages 旧部署，保留最新 ${KEEP_LATEST} 个"
          
          # 获取所有部署（按时间倒序）
          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          
          # 提取部署 ID
          DEPLOY_IDS=$(echo "$DEPLOYMENTS" | jq -r '.result[].id')
          
          COUNT=0
          DELETED=0
          
          for DEPLOY_ID in $DEPLOY_IDS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -le $KEEP_LATEST ]; then
              echo "保留: $DEPLOY_ID (第 $COUNT 个)"
              continue
            fi
            
            echo "删除: $DEPLOY_ID"
            RESULT=$(curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json")
            
            SUCCESS=$(echo "$RESULT" | jq -r '.success')
            if [ "$SUCCESS" = "true" ]; then
              DELETED=$((DELETED + 1))
            else
              echo "  删除失败: $(echo "$RESULT" | jq -r '.errors[0].message')"
            fi
            
            sleep 0.2
          done
          
          echo ""
          echo "清理完成！共删除 ${DELETED} 个旧部署，保留最新 ${KEEP_LATEST} 个"
